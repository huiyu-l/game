<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8f6ef">
<title>墨剑诗仙 · 打字降妖</title>
<style>
:root{
  --paper:#f8f6ef;
  --ink:#1f1d1a;
  --ink2:#4a4640;
  --ink3:#8a8378;
  --blood:#b0101c;
  --gold:#b3862c;
  --font:"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC","STSong","SimSun",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{
  background:#e6e1d5;
  font-family:var(--font);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;
}

/* ===== 画卷容器 ===== */
#scroll{
  position:relative;
  width:min(100%,600px);
  height:min(100dvh,940px);
  max-height:100dvh;
  background:var(--paper);
  overflow:hidden;
  display:flex;flex-direction:column;
  isolation:isolate;
  box-shadow:0 14px 70px rgba(30,25,18,.3),0 0 0 1px rgba(40,34,26,.12);
}
#scroll::before,#scroll::after{
  content:"";position:absolute;left:-7px;right:-7px;height:17px;z-index:32;
  background:linear-gradient(180deg,#5a4d3f,#2b241c 48%,#5a4d3f);
  border-radius:9px;box-shadow:0 2px 7px rgba(0,0,0,.38);
}
#scroll::before{top:-7px}
#scroll::after{bottom:-7px}

/* 宣纸墨晕 + 纸纹 */
#wash{position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 44% 30% at 6% 10%,rgba(30,28,25,.07),transparent 72%),
    radial-gradient(ellipse 52% 36% at 96% 86%,rgba(30,28,25,.06),transparent 72%),
    radial-gradient(ellipse 32% 24% at 78% 6%,rgba(30,28,25,.04),transparent 72%),
    radial-gradient(ellipse 38% 28% at 8% 92%,rgba(30,28,25,.05),transparent 72%),
    radial-gradient(ellipse 60% 20% at 50% 50%,rgba(30,28,25,.018),transparent 75%);
}
#wash::after{content:"";position:absolute;inset:0;opacity:.55;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(120,110,95,.02) 3px 4px),
             repeating-linear-gradient(90deg,transparent 0 5px,rgba(120,110,95,.014) 5px 6px);
}
#drops{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.drop{position:absolute;top:-8%;border-radius:50%;background:rgba(28,26,23,.55);animation:fall linear infinite;opacity:0}
.drop.gold{background:linear-gradient(135deg,#f0d78b,#c99a34);border-radius:2px}
@keyframes fall{
  0%{transform:translate3d(0,-10vh,0) scale(.5) rotate(0);opacity:0}
  9%{opacity:.6}
  50%{transform:translate3d(16px,55vh,0) scale(1) rotate(120deg);opacity:.42}
  91%{opacity:.32}
  100%{transform:translate3d(-12px,112vh,0) scale(.7) rotate(260deg);opacity:0}
}

/* ===== 顶部 HUD ===== */
.hud{position:relative;z-index:6;padding:10px 16px 6px;flex:none;display:flex;flex-direction:column;gap:7px}
.toolbar{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:3px;color:var(--ink3)}
.brand{font-weight:700;letter-spacing:5px;color:var(--ink2)}
#sound{border:1px solid rgba(40,36,30,.24);background:rgba(255,255,255,.55);color:var(--ink2);
  font-family:var(--font);font-size:11px;letter-spacing:1px;padding:3px 9px;border-radius:12px;cursor:pointer}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.side.right{align-items:flex-end;text-align:right}
.side .name{font-size:12px;letter-spacing:2px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hearts{display:flex;gap:4px;font-size:21px;line-height:1}
.heart{color:var(--blood);transition:.3s;text-shadow:0 1px 1px rgba(0,0,0,.12)}
.heart.lost{color:#d8d2c4;transform:scale(.82)}
.dots{display:flex;gap:5px;justify-content:flex-end}
.dot{width:15px;height:15px;border-radius:50% 46% 54% 47%;
  background:radial-gradient(circle at 34% 28%,#5c554c,#161412);
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.3s}
.dot.lost{background:#dcd6c8;box-shadow:none;opacity:.5;transform:scale(.66)}
.stage-info{text-align:center;flex:none;padding:0 4px}
.stage-info .lv{font-size:15px;font-weight:700;letter-spacing:2px;white-space:nowrap}
.stage-info .tag{font-size:10.5px;color:var(--ink3);letter-spacing:.5px;margin-top:3px;white-space:nowrap}

.timer-wrap{display:flex;align-items:center;gap:10px}
.timer-num{font-size:25px;font-weight:700;width:48px;text-align:center;font-variant-numeric:tabular-nums;flex:none;transition:color .2s}
.timer-num.danger{color:var(--blood);animation:pulse .45s infinite}
@keyframes pulse{50%{transform:scale(1.16)}}
.timer-track{flex:1;height:7px;background:rgba(30,28,25,.11);border-radius:9px;overflow:hidden}
.timer-fill{height:100%;width:100%;border-radius:9px;transform-origin:left center;
  background:linear-gradient(90deg,#26231e,#736b5e)}
.timer-fill.danger{background:linear-gradient(90deg,#7d0d16,#d4202c)}
.timer-label{font-size:11px;color:var(--ink3);letter-spacing:2px;flex:none}

/* ===== 战场 ===== */
#field{position:relative;z-index:4;flex:1;min-height:150px;display:flex;align-items:flex-end;
  justify-content:space-between;padding:0 8px 2px}
#hero,#enemy{width:41%;max-width:220px;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
#hero svg,#enemy svg{width:100%;height:100%;overflow:visible}
#hero{transform-origin:bottom left}
#enemy{transform-origin:bottom right}
.ground{position:absolute;bottom:6px;left:6%;right:6%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(30,28,25,.22) 20%,rgba(30,28,25,.22) 80%,transparent)}
.ground::after{content:"";position:absolute;left:10%;right:10%;top:2px;height:12px;
  background:radial-gradient(ellipse at center,rgba(30,28,25,.1),transparent 70%)}

#qi{position:absolute;left:20%;top:34%;width:64%;height:130px;pointer-events:none;z-index:8;opacity:0;
  background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.95) 32%,rgba(28,26,23,.6) 47%,rgba(255,255,255,.9) 60%,transparent 100%);
  clip-path:polygon(0 44%,100% 0,100% 26%,0 66%);
  transform:translateX(-140%) rotate(-6deg) scaleX(.4)}
#qi.go{animation:qiSlash .44s ease-out forwards}
@keyframes qiSlash{
  0%{opacity:0;transform:translateX(-130%) rotate(-6deg) scaleX(.4)}
  22%{opacity:1}
  100%{opacity:0;transform:translateX(62%) rotate(-6deg) scaleX(1.5)}
}
#splash{position:absolute;inset:0;pointer-events:none;z-index:9}
.splat{position:absolute;border-radius:50%;background:#1a1815;opacity:.85;animation:burst .75s ease-out forwards}
@keyframes burst{
  0%{transform:translate(0,0) scale(.35);opacity:.9}
  100%{transform:translate(var(--dx),var(--dy)) scale(var(--s));opacity:0}
}
.float{position:absolute;z-index:12;font-size:19px;font-weight:700;letter-spacing:2px;pointer-events:none;
  white-space:nowrap;text-shadow:0 2px 10px #fff,0 0 6px #fff;animation:floatUp .95s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(12px) scale(.8)}25%{opacity:1;transform:translateY(0) scale(1.08)}100%{opacity:0;transform:translateY(-46px) scale(1)}}

@keyframes heroSlash{0%{transform:translateX(0)}30%{transform:translateX(16px) rotate(-3deg)}58%{transform:translateX(5px) rotate(4deg)}100%{transform:translateX(0)}}
#hero.attack{animation:heroSlash .46s ease}
#hero .sword{transform-box:fill-box;transform-origin:14% 88%}
#hero.attack .sword{animation:swordSwing .46s ease}
@keyframes swordSwing{0%{transform:rotate(-34deg)}42%{transform:rotate(62deg)}100%{transform:rotate(-34deg)}}
@keyframes enemyHit{
  0%{transform:translateX(0) scale(1)}
  20%{transform:translateX(26px) scale(.91) rotate(5deg);filter:brightness(1.5)}
  56%{transform:translateX(12px) scale(.97) rotate(-2deg)}
  100%{transform:translateX(0) scale(1)}
}
#enemy.hit{animation:enemyHit .5s ease}
@keyframes enemyCast{0%{transform:translateX(0)}35%{transform:translateX(-34px) scale(1.12)}100%{transform:translateX(0)}}
#enemy.cast{animation:enemyCast .8s ease}
@keyframes enemyDie{to{transform:translateY(32px) scale(.28) rotate(20deg);opacity:0;filter:blur(5px)}}
#enemy.die{animation:enemyDie .62s ease forwards}
@keyframes heroFall{to{transform:translateY(26px) rotate(80deg);opacity:.2;filter:blur(2px)}}
#hero.fall{animation:heroFall 1s ease forwards}

/* ===== 诗句卡 ===== */
#poemCard{position:relative;z-index:6;margin:0 16px 9px;padding:17px 14px 13px;text-align:center;flex:none;
  background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(247,244,235,.55));
  border:1px solid rgba(40,36,30,.2);border-radius:3px;cursor:text;
  box-shadow:0 7px 24px rgba(40,34,26,.09),inset 0 0 0 4px rgba(255,255,255,.42)}
#poemCard::before,#poemCard::after{content:"";position:absolute;width:15px;height:15px;border:2px solid rgba(40,36,30,.32)}
#poemCard::before{top:5px;left:5px;border-right:0;border-bottom:0}
#poemCard::after{bottom:5px;right:5px;border-left:0;border-top:0}
.poem-line{font-size:clamp(23px,6.2vw,35px);letter-spacing:.14em;line-height:1.65;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrong{color:var(--blood);display:inline-block;position:relative;
  text-shadow:0 0 14px rgba(176,16,28,.3);animation:wrongWobble 2.3s ease-in-out infinite}
.wrong::after{content:"";position:absolute;left:-2px;right:-2px;bottom:0;height:3px;border-radius:50%;
  background:var(--blood);opacity:.75;transform:rotate(-3deg)}
@keyframes wrongWobble{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-3deg) translateY(-2px)}75%{transform:rotate(3deg) translateY(2px)}}
.src{font-size:11.5px;color:var(--ink3);letter-spacing:1px;margin-top:7px}
.tip{font-size:11.5px;color:var(--ink2);letter-spacing:1px;margin-top:4px}

/* ===== 输入条 ===== */
#bar{position:relative;z-index:6;padding:2px 16px 18px;flex:none}
#form{display:flex;align-items:center;gap:14px;width:100%}
#answer{flex:1;min-width:0;height:58px;padding:0 14px;font-family:var(--font);font-size:25px;
  text-align:center;color:var(--ink);background:rgba(255,255,255,.65);
  border:1.5px solid rgba(40,36,30,.32);border-radius:4px;outline:none;
  caret-color:var(--blood);letter-spacing:3px;user-select:text;-webkit-user-select:text;
  transition:.2s;box-shadow:inset 0 2px 6px rgba(40,34,26,.05)}
#answer:focus{border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(30,28,25,.08)}
#answer::placeholder{color:#b0a998;font-size:14px;letter-spacing:2px}
#slash{width:88px;height:88px;flex:none;border-radius:50%;border:3px solid #8d1f1c;
  background:radial-gradient(circle at 36% 28%,#c43a2b,#8d1f1c 68%,#65120e);
  color:#fff3e2;font-family:var(--font);font-size:44px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 6px 18px rgba(120,20,16,.42),inset 0 0 0 4px rgba(255,255,255,.17);
  transition:transform .12s,box-shadow .12s;touch-action:manipulation}
#slash:active{transform:scale(.9);box-shadow:0 2px 8px rgba(120,20,16,.42)}

/* ===== 特效层 ===== */
#flash{position:absolute;inset:0;z-index:18;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(190,20,30,.06),rgba(160,8,18,.6))}
#flash.on{animation:redFlash .46s ease}
@keyframes redFlash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
@keyframes shake{
  0%,100%{transform:translate(0,0)}15%{transform:translate(-10px,5px)}30%{transform:translate(9px,-6px)}
  45%{transform:translate(-8px,-3px)}60%{transform:translate(7px,6px)}80%{transform:translate(-4px,2px)}
}
#scroll.shake{animation:shake .44s ease}
#toast{position:absolute;top:36%;left:0;right:0;z-index:20;pointer-events:none;text-align:center;
  font-size:clamp(27px,7.2vw,44px);font-weight:700;letter-spacing:7px;opacity:0;
  text-shadow:0 2px 14px rgba(255,255,255,.95),0 0 22px rgba(255,255,255,.8)}
#toast.show{animation:toastPop 1s ease forwards}
@keyframes toastPop{
  0%{opacity:0;transform:scale(.6) translateY(14px)}
  20%{opacity:1;transform:scale(1.1) translateY(0)}
  70%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.04) translateY(-18px)}
}

/* ===== 弹层 ===== */
#overlay{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-start;justify-content:center;
  padding:22px;text-align:center;overflow-y:auto;
  background:rgba(248,246,238,.94);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  transition:opacity .4s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay.win{background:radial-gradient(ellipse at 50% 35%,#fdf8e9,#f3ead3 70%,#e9dcc0)}
#overlay.lose{background:radial-gradient(ellipse at 50% 40%,#f2efe7,#ded9cd)}
.panel{max-width:470px;width:100%;margin:auto;animation:panelIn .65s ease both}
@keyframes panelIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.title{font-size:clamp(42px,11vw,68px);letter-spacing:.2em;font-weight:700;margin:10px 0 4px;
  background:linear-gradient(180deg,#1d1b18,#514c44);-webkit-background-clip:text;background-clip:text;color:transparent}
.title.win-title{background:linear-gradient(180deg,#a97c22,#d9b04d,#8d6518);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 3px 12px rgba(179,134,44,.35));animation:titleReveal 1.2s ease both}
@keyframes titleReveal{from{opacity:0;letter-spacing:.7em;transform:scale(.85)}to{opacity:1;letter-spacing:.2em;transform:scale(1)}}
.title.lose-title{background:linear-gradient(180deg,#4a4640,#8a8378);-webkit-background-clip:text;background-clip:text;
  font-size:clamp(29px,7.4vw,44px);letter-spacing:.08em;white-space:nowrap}
.seal{display:inline-block;padding:4px 10px;border:2px solid var(--blood);color:var(--blood);
  font-size:12px;letter-spacing:5px;transform:rotate(-4deg)}
.seal.gold{border-color:var(--gold);color:var(--gold)}
.desc{font-size:14px;line-height:2;color:var(--ink2);margin:18px 0 14px;letter-spacing:1px}
.rules{text-align:left;font-size:12.5px;line-height:2;color:var(--ink2);
  background:rgba(255,255,255,.6);border:1px solid rgba(40,36,30,.15);
  padding:12px 16px;margin:0 0 18px;border-radius:3px}
.rules strong{color:var(--blood)}
.stats{font-size:14px;color:var(--ink2);line-height:2.1;letter-spacing:1px;margin:16px 0 6px}
.btn{display:inline-block;margin:6px;padding:12px 28px;font-family:var(--font);font-size:18px;letter-spacing:4px;
  color:#fbf8f0;background:linear-gradient(180deg,#35312b,#1b1916);border:1px solid #111;
  cursor:pointer;border-radius:3px;box-shadow:0 5px 14px rgba(0,0,0,.22);transition:.2s}
.btn:hover{filter:brightness(1.22);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink2);box-shadow:none}
.act-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:8px}
.act-grid .btn{font-size:15px;letter-spacing:2px;padding:10px 17px;margin:4px}
.mini{font-size:11.5px;color:var(--ink3);letter-spacing:1px;margin-top:14px;line-height:1.8}

/* ===== 错题复盘（仅结算页内） ===== */
.review{text-align:left;margin-top:12px}
.rv-title{text-align:center;font-size:20px;letter-spacing:6px;margin:4px 0 6px;font-weight:700}
.rv-sub{text-align:center;font-size:11px;color:var(--ink3);margin-bottom:12px;line-height:1.7}
.rv-item{border:1px solid rgba(40,36,30,.17);background:rgba(255,255,255,.62);
  padding:10px 12px;margin-bottom:9px;border-radius:3px}
.rv-head{display:flex;align-items:center;gap:7px;font-size:11px;margin-bottom:6px;flex-wrap:wrap}
.rv-no{font-weight:700;color:var(--ink3)}
.rv-cause{padding:1px 7px;border:1px solid var(--blood);color:var(--blood);border-radius:9px}
.rv-cause.timeout{border-color:#7a663c;color:#7a663c}
.rv-type{padding:1px 7px;background:rgba(30,28,25,.08);border-radius:9px;color:var(--ink2)}
.rv-fix{font-size:13.5px;margin-bottom:5px;color:var(--ink2)}
.rv-bad{color:var(--blood);font-size:18px}
.rv-good{color:var(--ink);font-size:18px}
.rv-line{font-size:19px;letter-spacing:2px;font-weight:600;margin:5px 0;line-height:1.6;word-break:break-all}
.rv-src{font-size:11px;color:var(--ink3);margin-bottom:8px}
.rv-btn{font-family:var(--font);font-size:12px;letter-spacing:2px;padding:5px 12px;
  border:1px solid var(--ink2);background:transparent;color:var(--ink);border-radius:2px;cursor:pointer}
.rv-btn:hover{background:rgba(30,28,25,.08)}
.rv-poem{margin-top:9px;padding:10px 12px;background:rgba(30,28,25,.05);
  border-left:3px solid var(--ink2);max-height:230px;overflow-y:auto;border-radius:2px}
.rv-poem-title{font-size:17px;font-weight:700;letter-spacing:2px}
.rv-poem-meta{font-size:11px;color:var(--blood);margin:3px 0 9px;letter-spacing:1px}
.rv-poem-body p{margin:0 0 5px;font-size:13.5px;line-height:1.9;letter-spacing:1px;color:var(--ink2);text-align:left}
.rv-back{display:block;margin:16px auto 0!important;font-size:15px}
.rv-back.rv-top{margin:0 auto 12px!important;font-size:13px;padding:7px 16px}
.rv-empty{text-align:center;font-size:15px;color:var(--ink2);padding:22px 0;letter-spacing:2px}

/* ===== 移动端 ===== */
@media (max-width:640px){
  body{background:var(--paper)}
  #scroll{width:100%;height:100dvh;max-height:none;box-shadow:none}
  #scroll::before,#scroll::after{display:none}
  .hud{padding:8px 12px 5px;gap:6px}
  .hearts{font-size:18px}
  .stage-info .lv{font-size:13px}
  .stage-info .tag{font-size:9.5px}
  .side .name{font-size:11px}
  #field{min-height:120px;padding:0 4px 0}
  #poemCard{margin:0 12px 7px;padding:14px 10px 11px}
  #bar{padding:2px 12px calc(12px + env(safe-area-inset-bottom))}
  #form{gap:11px}
  #answer{height:52px;font-size:22px}
  #slash{width:74px;height:74px;font-size:37px;border-width:2px}
  .rules{font-size:12px;padding:10px 13px}
  .rv-line{font-size:17px}
  .rv-poem{max-height:200px}
}
</style>
</head>
<body>
<div id="scroll">
  <div id="wash"></div>
  <div id="drops"></div>

  <div class="hud">
    <div class="toolbar">
      <span class="brand">墨 剑 诗 仙</span>
      <button id="sound" type="button">♪ 音效：开</button>
    </div>
    <div class="hud-row">
      <div class="side">
        <span class="name">◀ 我方剑客</span>
        <div class="hearts" id="hearts"></div>
      </div>
      <div class="stage-info">
        <div class="lv" id="lv">第 1 关 · 第 1 波</div>
        <div class="tag" id="tag">小学 · 8 秒 · 同音/形近</div>
      </div>
      <div class="side right">
        <span class="name" id="enemyName">小墨妖 ▶</span>
        <div class="dots" id="dots"></div>
      </div>
    </div>
    <div class="timer-wrap">
      <span class="timer-label">墨　漏</span>
      <div class="timer-track"><div class="timer-fill" id="fill"></div></div>
      <span class="timer-num" id="timerNum">8.0</span>
    </div>
  </div>

  <div id="field">
    <div id="hero"></div>
    <div id="enemy"></div>
    <div id="qi"></div>
    <div id="splash"></div>
    <div class="ground"></div>
  </div>

  <div id="poemCard">
    <div class="poem-line" id="poemLine"></div>
    <div class="src" id="src"></div>
    <div class="tip" id="tip">找出血色错字，输入正确的字</div>
  </div>

  <div id="bar">
    <form id="form" autocomplete="off">
      <input id="answer" type="text" maxlength="6" enterkeyhint="go" inputmode="text"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             placeholder="点此 / 点题目，输入正字">
      <button id="slash" type="submit" aria-label="发射剑气">斩</button>
    </form>
  </div>

  <div id="flash"></div>
  <div id="toast"></div>

  <div id="overlay"></div>
</div>

<script>

{t:'琵琶行',a:'白居易',d:'唐',lv:3,
 p:['浔阳江头夜送客，枫叶荻花秋瑟瑟。','主人下马客在船，举酒欲饮无管弦。','醉不成欢惨将别，别时茫茫江浸月。','忽闻水上琵琶声，主人忘归客不发。','寻声暗问弹者谁，琵琶声停欲语迟。','移船相近邀相见，添酒回灯重开宴。','千呼万唤始出来，犹抱琵琶半遮面。','转轴拨弦三两声，未成曲调先有情。','弦弦掩抑声声思，似诉平生不得志。','低眉信手续续弹，说尽心中无限事。','轻拢慢捻抹复挑，初为霓裳后六幺。','大弦嘈嘈如急雨，小弦切切如私语。','嘈嘈切切错杂弹，大珠小珠落玉盘。','间关莺语花底滑，幽咽泉流冰下难。','冰泉冷涩弦凝绝，凝绝不通声暂歇。','别有幽愁暗恨生，此时无声胜有声。','银瓶乍破水浆迸，铁骑突出刀枪鸣。','曲终收拨当心画，四弦一声如裂帛。','东船西舫悄无言，唯见江心秋月白。','沉吟放拨插弦中，整顿衣裳起敛容。','自言本是京城女，家在虾蟆陵下住。','十三学得琵琶成，名属教坊第一部。','曲罢曾教善才服，妆成每被秋娘妒。','五陵年少争缠头，一曲红绡不知数。','钿头银篦击节碎，血色罗裙翻酒污。','今年欢笑复明年，秋月春风等闲度。','弟走从军阿姨死，暮去朝来颜色故。','门前冷落鞍马稀，老大嫁作商人妇。','商人重利轻别离，前月浮梁买茶去。','去来江口守空船，绕船月明江水寒。','夜深忽梦少年事，梦啼妆泪红阑干。','我闻琵琶已叹息，又闻此语重唧唧。','同是天涯沦落人，相逢何必曾相识！','我从去年辞帝京，谪居卧病浔阳城。','浔阳地僻无音乐，终岁不闻丝竹声。','住近湓江地低湿，黄芦苦竹绕宅生。','其间旦暮闻何物？杜鹃啼血猿哀鸣。','春江花朝秋月夜，往往取酒还独倾。','岂无山歌与村笛，呕哑嘲哳难为听。','今夜闻君琵琶语，如听仙乐耳暂明。','莫辞更坐弹一曲，为君翻作琵琶行。','感我此言良久立，却坐促弦弦转急。','凄凄不似向前声，满座重闻皆掩泣。','座中泣下谁最多？江州司马青衫湿。'],

function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}

/* 随机抽名句 + 随机抽一处同音/形近替换 */
function buildQPool(tier){
  var arr=[];
  for(var i=0;i<POEMS.length;i++){
    if(POEMS[i].lv!==tier) continue;
    for(var j=0;j<POEMS[i].q.length;j++) arr.push([i,j]);
  }
  return shuffle(arr);
}
function nextQuestion(stage){
  var tier=Math.min(stage,3);
  if(!qpool[tier].length) qpool[tier]=buildQPool(tier);
  var pair=qpool[tier].pop();
  var pi=pair[0], p=POEMS[pi], item=p.q[pair[1]];
  var cand=item.c[Math.floor(Math.random()*item.c.length)];
  var chars=Array.from(item.s);
  return {
    pi:pi, line:item.s, idx:cand[0], wrong:cand[1], type:cand[2],
    right:chars[cand[0]], p:p,
    src:'［'+p.d+'］'+p.a+'《'+p.t+'》'
  };
}

var actx=null, master=null;
function audioInit(){
  if(actx){ if(actx.state==='suspended') actx.resume(); return; }
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  try{
    actx=new AC();
    master=actx.createGain(); master.gain.value=0.5; master.connect(actx.destination);
  }catch(e){ actx=null; }
}
function play(fn){
  if(S.muted) return;
  audioInit();
  if(!actx||!master) return;
  try{ fn(); }catch(e){}
}
function noiseBuf(dur){
  var n=Math.max(1,Math.floor(actx.sampleRate*dur));
  var b=actx.createBuffer(1,n,actx.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
  return b;
}
function env(g,t,peak,atk,dec){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001,t+atk+dec);
}
/* 古筝拨弦 */
function guzheng(freq,dur,vol,delay){
  dur=dur||1.1; vol=vol||0.24; delay=delay||0;
  play(function(){
    var t=actx.currentTime+delay;
    var out=actx.createGain(); out.gain.value=1; out.connect(master);
    var lp=actx.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(freq*9,t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(200,freq*2.1),t+dur);
    lp.connect(out);
    var hs=[1,2.01,3.02,4.04], amps=[0.9,0.3,0.13,0.055];
    for(var i=0;i<hs.length;i++){
      var o=actx.createOscillator(); o.type=i===0?'triangle':'sine';
      o.frequency.setValueAtTime(freq*hs[i],t);
      o.frequency.linearRampToValueAtTime(freq*hs[i]*0.994,t+dur);
      var g=actx.createGain();
      env(g,t,vol*amps[i],0.006,dur*(1-i*0.13));
      o.connect(g); g.connect(lp); o.start(t); o.stop(t+dur+0.06);
    }
    var ns=actx.createBufferSource(); ns.buffer=noiseBuf(0.05);
    var nf=actx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=freq*4.5; nf.Q.value=1.1;
    var ng=actx.createGain(); env(ng,t,vol*0.35,0.002,0.045);
    ns.connect(nf); nf.connect(ng); ng.connect(out); ns.start(t);
  });
}

/* ================= 渲染 ================= */
function renderHero(){ hero.innerHTML=heroSVG(); }
function renderEnemy(){ enemy.innerHTML=enemySVG(S.wave,S.stage); }
function renderHud(){
  var h='';
  for(var i=0;i<S.maxHp;i++) h+='<span class="heart'+(i<S.hp?'':' lost')+'">♥</span>';
  hearts.innerHTML=h;
  var d='';
  for(var j=0;j<S.enemyMax;j++) d+='<span class="dot'+(j<S.enemyHp?'':' lost')+'"></span>';
  dots.innerHTML=d;
  lv.textContent='第 '+S.stage+' 关 · 第 '+S.wave+' 波';
  tag.textContent=tierOf(S.stage)+' · '+S.timeLimit+' 秒 · 同音/形近';
  enemyName.textContent=ENEMY[S.wave-1]+(S.wave===3?'（精英）':'')+' ▶';
}
function renderQuestion(){
  var chars=Array.from(S.q.line), html='';
  for(var i=0;i<chars.length;i++){
    html += (i===S.q.idx) ? '<span class="wrong">'+S.q.wrong+'</span>' : chars[i];
  }
  poemLine.innerHTML=html;
  srcEl.textContent='—— '+S.q.src;
  tipEl.textContent='找出血色错字，输入正确的字';
  answer.value='';
  renderHud();
}
function fillTimer(ratio){
  fill.style.transform='scaleX('+ratio+')';
  timerNum.textContent=(S.timeLimit*ratio).toFixed(1);
  var danger=ratio<0.3;
  fill.classList.toggle('danger',danger);
  timerNum.classList.toggle('danger',danger);
}

/* ================= 流程 ================= */
function startTimer(){
  stopTimer();
  /* 绝对时间戳 + 定时器：标签页被节流时超时判定依然可靠 */
  S.deadline=Date.now()+S.timeLimit*1000;
  fillTimer(1);
  S.raf=setInterval(function(){
    if(S.phase!=='playing'||S.busy) return;
    var left=Math.max(0,S.deadline-Date.now());
    var ratio=left/(S.timeLimit*1000);
    fillTimer(ratio);
    if(left<=0){ stopTimer(); onTimeout(); }
  },50);
}
function stopTimer(){ if(S.raf){ clearInterval(S.raf); S.raf=0; } }

function newQuestion(){
  S.q=nextQuestion(S.stage);
  renderQuestion();
  S.busy=false; S.phase='playing';
  startTimer();
  focusInput();
}

function fire(){
  if(S.phase!=='playing'||S.busy) return;
  var val=answer.value.trim();
  if(!val){ focusInput(); return; }
  /* 拼音尚未上屏时不发射、不判错 */
  if(/[a-zA-Z\s]/.test(val)){
    answer.value='';
    floatText('请先选字上屏','#8a8378',false);
    focusInput(); return;
  }
  S.busy=true; stopTimer();
  var done=function(cont){ if(cont && S.phase==='playing') newQuestion(); };
  if(val===S.q.right){ onCorrect().then(done); }
  else{ onWrong().then(done); }
}

function onCorrect(){
  S.correct++; S.streak++; S.best=Math.max(S.best,S.streak);
  var crit=(S.streak%3===0);
  var dmg=crit?2:1;
  sfxSword(); sfxSplat();
  hero.classList.remove('attack'); void hero.offsetWidth; hero.classList.add('attack');
  qi.classList.remove('go'); void qi.offsetWidth; qi.classList.add('go');
  return sleep(150).then(function(){
    enemy.classList.remove('hit'); void enemy.offsetWidth; enemy.classList.add('hit');
    splash(crit?22:13);
    S.enemyHp=Math.max(0,S.enemyHp-dmg);
    if(crit){
      S.crit++; S.hp=Math.min(S.maxHp,S.hp+1);
      sfxCrit(); showToast('剑气暴击！','#b0101c');
      floatText('妖 -2　我 +1','#b0101c',true);
    }else{
      guzheng(523.25,0.7,0.15);
      floatText('斩 · 妖 -1','#1f1d1a',true);
    }
    renderHud();
    answer.value='';
    return sleep(crit?620:430);
  }).then(function(){
    if(S.enemyHp<=0) return onEnemyDown().then(function(){ return false; });
    return true;
  });
}

/* 战斗中绝不弹解析：只扣血、震屏、警告，正解留到结算复盘 */
function onWrong(){
  sfxWrong();
  logMistake('答错');
  S.streak=0; S.hp=Math.max(0,S.hp-1);
  shakeAndFlash();
  showToast('错字未除！','#b0101c');
  renderHud();
  answer.value='';
  return sleep(720).then(function(){
    if(S.hp<=0){ gameOver(); return false; }
    return true;
  });
}

function onTimeout(){
  if(S.phase!=='playing'||S.busy) return;
  S.busy=true; stopTimer();
  sfxBig();
  logMistake('超时');
  S.hp=Math.max(0,S.hp-2); S.streak=0;
  shakeAndFlash();
  enemy.classList.remove('cast'); void enemy.offsetWidth; enemy.classList.add('cast');
  showToast('妖物施法！','#7d0d16');
  floatText('我 -2','#7d0d16',false);
  renderHud();
  answer.value='';
  return sleep(1000).then(function(){
    enemy.classList.remove('cast');
    if(S.hp<=0){ gameOver(); return; }
    S.phase='playing';
    newQuestion();
  });
}

function onEnemyDown(){
  sfxClash();
  enemy.classList.remove('die'); void enemy.offsetWidth; enemy.classList.add('die');
  splash(26);
  return sleep(620).then(function(){
    enemy.classList.remove('die');
    S.phase='transition';
    if(S.wave<3){
      S.wave++;
      S.enemyMax=waveHp(S.stage,S.wave); S.enemyHp=S.enemyMax;
      showToast('第 '+S.wave+' 波 · '+ENEMY[S.wave-1]+'来袭','#1f1d1a');
      sfxWave();
      renderEnemy(); renderHud();
      return sleep(1150).then(function(){ S.phase='playing'; newQuestion(); });
    }
    if(S.stage===3 && !S.hasWon){
      S.hasWon=true;
      return sleep(300).then(function(){ gameWin(); });
    }
    showToast('第 '+S.stage+' 关 · 通关！','#1f1d1a');
    sfxWave();
    return sleep(1250).then(function(){
      S.stage++; S.wave=1;
      S.timeLimit=timeFor(S.stage);
      S.enemyMax=waveHp(S.stage,1); S.enemyHp=S.enemyMax;
      renderEnemy(); renderHud();
      showToast(S.stage<=3?('第 '+S.stage+' 关 · '+tierOf(S.stage)):('无尽试炼 · 第 '+S.stage+' 关'),'#1f1d1a');
      return sleep(1150).then(function(){ S.phase='playing'; newQuestion(); });
    });
  });
}

/* ================= 弹层与复盘 ================= */
function showOverlay(html,cls){
  overlay.className=cls||'';
  overlay.innerHTML=html;
  overlay.scrollTop=0;
}
function hideOverlay(){ overlay.className='hidden'; }
function secs(){ return Math.max(0,Math.round((Date.now()-S.startAt)/1000)); }
function statsHTML(){
  return '<div class="stats">'+
    '答对 <strong>'+S.correct+'</strong> 题　·　最高连击 <strong>'+S.best+'</strong><br>'+
    '剑气暴击 <strong>'+S.crit+'</strong> 次　·　失手 <strong>'+S.mistakes.length+'</strong> 处　·　历时 <strong>'+secs()+'</strong> 秒'+
  '</div>';
}
function actionHTML(isWin){
  return '<div id="actSlot" class="act-grid">'+
    '<button class="btn" data-act="restart">'+(isWin?'再 战 一 局':'重 新 来 过')+'</button>'+
    '<button class="btn ghost" data-act="review">查看错题解析</button>'+
    '<button class="btn ghost" data-act="home">返 回 首 页</button>'+
    (isWin?'<button class="btn ghost" data-act="endless">继续修行 · 无尽试炼</button>':'')+
  '</div><div id="reviewSlot" hidden></div>';
}
function reviewHTML(){
  if(!S.mistakes.length) return '<div class="rv-empty">本局字字皆中，无一错漏。</div>';
  var h='';
  for(var i=0;i<S.mistakes.length;i++){
    var m=S.mistakes[i], p=POEMS[m.pi];
    h+='<div class="rv-item">'+
      '<div class="rv-head"><span class="rv-no">'+('0'+(i+1)).slice(-2)+'</span>'+
        '<span class="rv-cause'+(m.cause==='超时'?' timeout':'')+'">'+m.cause+'</span>'+
        '<span class="rv-type">'+m.type+'字</span></div>'+
      '<div class="rv-fix">妖作「<b class="rv-bad">'+m.wrong+'</b>」　正字「<b class="rv-good">'+m.right+'</b>」</div>'+
      '<div class="rv-line">'+m.line+'</div>'+
      '<div class="rv-src">［'+p.d+'］'+p.a+'《'+p.t+'》</div>'+
      '<button class="rv-btn" data-act="poem" data-i="'+m.pi+'">阅 读 全 诗 ▾</button>'+
      '<div class="rv-poem" hidden></div>'+
    '</div>';
  }
  return h;
}
function poemHTML(i){
  var p=POEMS[i], body='';
  for(var k=0;k<p.p.length;k++) body+='<p>'+p.p[k]+'</p>';
  return '<div class="rv-poem-title">《'+p.t+'》</div>'+
    '<div class="rv-poem-meta">'+p.d+' · '+p.a+'　|　'+TIER[p.lv]+'必背 · 全诗</div>'+
    '<div class="rv-poem-body">'+body+'</div>';
}
function openReview(){
  var slot=$('#reviewSlot'), act=$('#actSlot');
  if(!slot||!act) return;
  slot.innerHTML='<div class="review">'+
    '<h3 class="rv-title">错 题 复 盘</h3>'+
    '<div class="rv-sub">共 '+S.mistakes.length+' 处失手 · 点「阅读全诗」查看完整篇目与作者朝代</div>'+
    '<button class="btn ghost rv-back rv-top" data-act="closeReview">收 起 解 析</button>'+
    reviewHTML()+
    '<button class="btn ghost rv-back" data-act="closeReview">收 起 解 析</button>'+
  '</div>';
  slot.hidden=false; act.hidden=true;
  overlay.scrollTop=0;
}
function closeReview(){
  var slot=$('#reviewSlot'), act=$('#actSlot');
  if(slot) slot.hidden=true;
  if(act) act.hidden=false;
  overlay.scrollTop=0;
}
function togglePoem(btn){
  var box=btn.nextElementSibling;
  if(!box) return;
  if(box.hidden){
    box.innerHTML=poemHTML(parseInt(btn.getAttribute('data-i'),10));
    box.hidden=false; btn.textContent='收 起 全 诗 ▴';
  }else{
    box.hidden=true; btn.textContent='阅 读 全 诗 ▾';
  }
}

/* 返回首页：彻底清空进度、状态、特效与题库队列 */
function goHome(){
  stopTimer();
  S.busy=true; S.phase='title';
  S.hp=S.maxHp; S.stage=1; S.wave=1;
  S.enemyHp=2; S.enemyMax=2;
  S.streak=0; S.best=0; S.correct=0; S.crit=0;
  S.timeLimit=8; S.deadline=0; S.startAt=0;
  S.mistakes=[]; S.hasWon=false; S.q=null; S.composing=false;
  qpool={1:[],2:[],3:[]};
  answer.value='';
  clearEffects();
  renderHero(); renderEnemy(); renderHud(); fillTimer(1);
  poemLine.innerHTML=''; srcEl.textContent='';
  tipEl.textContent='找出血色错字，输入正确的字';
  titleScreen();
}

function resetGame(endless){
  stopTimer();
  S.hp=3; S.maxHp=3; S.stage=endless?4:1; S.wave=1;
  S.streak=0; S.best=0; S.correct=0; S.crit=0; S.mistakes=[];
  S.timeLimit=timeFor(S.stage);
  S.enemyMax=waveHp(S.stage,1); S.enemyHp=S.enemyMax;
  S.hasWon=!!endless; S.busy=true; S.phase='playing';
  S.startAt=Date.now(); S.q=null; S.deadline=0; S.composing=false;
  qpool={1:[],2:[],3:[]};
  answer.value='';
  clearEffects();
  renderHero(); renderEnemy();
  hideOverlay();
  showToast(endless?('无尽试炼 · 第 '+S.stage+' 关'):'第 1 关 · 蒙学','#1f1d1a');
  sfxWave();
  setTimeout(function(){ newQuestion(); },700);
}

overlay.addEventListener('click',function(e){
  var btn=e.target.closest('[data-act]');
  if(!btn) return;
  audioInit();
  var act=btn.getAttribute('data-act');
  if(act==='start'||act==='restart'){ resetGame(false); }
  else if(act==='endless'){ resetGame(true); }
  else if(act==='home'){ goHome(); }
  else if(act==='review'){ openReview(); }
  else if(act==='closeReview'){ closeReview(); }
  else if(act==='poem'){ togglePoem(btn); }
});

form.addEventListener('submit',function(e){
  e.preventDefault();
  if(S.composing) return;
  fire();
  focusInput();
});

/* PC 键盘：阻止页面默认滚动，Enter 发射；兼容中文输入法组合态 */
var scrollKeys=['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'];
document.addEventListener('keydown',function(e){
  if(e.isComposing||e.keyCode===229) return;
  if(scrollKeys.indexOf(e.code)>-1 && document.activeElement!==answer) e.preventDefault();
  if(e.key==='Enter' && e.target!==answer){
    e.preventDefault();
    if(form.requestSubmit) form.requestSubmit(); else fire();
  }
},{passive:false});

answer.addEventListener('compositionstart',function(){ S.composing=true; });
answer.addEventListener('compositionend',function(){ setTimeout(function(){ S.composing=false; },0); });
answer.addEventListener('input',function(){
  if(answer.value.length>6) answer.value=answer.value.slice(0,6);
});

/* 点击题目 / 战场 / 空白处唤起输入法（移动端） */
scroll.addEventListener('pointerdown',function(e){
  if(e.target.closest('button,#overlay')) return;
  if(S.phase==='playing') setTimeout(focusInput,0);
});

soundBtn.addEventListener('click',function(){
  S.muted=!S.muted;
  soundBtn.textContent=S.muted?'♪ 音效：关':'♪ 音效：开';
  if(!S.muted){ audioInit(); guzheng(440,0.6,0.15); }
});

/* 移动端：软键盘弹出时收紧画卷高度，保证输入框可见 */
if(window.visualViewport && window.matchMedia('(max-width:640px)').matches){
  var fit=function(){ scroll.style.height=window.visualViewport.height+'px'; };
  window.visualViewport.addEventListener('resize',fit);
  fit();
}

/* 初始化 */
makeDrops();
renderHero();
renderEnemy();
renderHud();
titleScreen();
})();
</script>
</body>
</html>
